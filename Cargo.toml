[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-pa-key-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Platform custody and public projection for Crowsi PA keys"
license = "Apache-2.0"
readme = "README.md"
publish = false
autotests = false
repository = "https://github.com/crowsi-net/crowsi-pa-key-agent"

[features]
default = []
# Reserved for a future privileged bootstrap-authorizer binary and its tests.
bootstrap-authorizer-internal = []
# Explicit local deployment policy. The owner OS session remains the TCB.
owner-local-bootstrap = ["bootstrap-authorizer-internal"]

[workspace]
members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22.1"
ciborium = "0.2.2"
crowsi-credential-broker = { version = "=0.1.0", registry = "ecosystem-private" }
crowsi-credential-authority-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
crowsi-local-control-bridge = { version = "=0.1.0", registry = "ecosystem-private" }
crowsi-windows-operation-contracts = { version = "=0.1.0", registry = "ecosystem-private" }
ihat-identity-assertion-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
getrandom = "0.3.4"
hex = "0.4.3"
nix = { version = "0.29.0", features = ["fs", "user"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[[test]]
name = "authorization"
path = "tests/harnesses/authorization.rs"

[[test]]
name = "destruction"
path = "tests/harnesses/destruction.rs"

[[test]]
name = "passkey_authentication"
path = "tests/passkey_authentication.rs"
